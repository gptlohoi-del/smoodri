name: Build SmooDri APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android :app:assembleDebug --no-daemon

      - name: Name APK using application version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 - <<'PYVERSION'
          import pathlib, re, sys
          data = pathlib.Path('android/app/build.gradle').read_text(encoding='utf-8')
          match = re.search(r"(?m)^\s*versionName\s+['\"]([^'\"]+)['\"]", data)
          if not match:
              sys.exit('Missing versionName in android/app/build.gradle')
          print(match.group(1))
          PYVERSION
          )
          APK_NAME="SmooDri-v${VERSION}-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "Created: $APK_NAME"

      - name: Upload SmooDri APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 30
